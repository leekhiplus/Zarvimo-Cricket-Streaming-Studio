name: Build Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

# Least privilege: the build only needs to read the repository.
permissions:
  contents: read

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # Finds the Gradle project automatically:
      #   1. a real project in the repo (settings.gradle(.kts) next to an app/ module), in any sub-folder; or
      #   2. if the repo only holds a ZIP (GitHub does NOT unpack ZIPs on upload), the ZIP is extracted here and used.
      # Stray flat files (settings.gradle.kts without an app/ folder beside it) are ignored.
      - name: Locate Gradle project
        id: locate
        shell: bash
        run: |
          find_project() {
            local root="$1" f d
            while IFS= read -r f; do
              d=$(dirname "$f")
              if [ -f "$d/app/build.gradle.kts" ] || [ -f "$d/app/build.gradle" ]; then
                echo "$d"
                return 0
              fi
            done < <(find "$root" -maxdepth 4 \( -name settings.gradle.kts -o -name settings.gradle \) -not -path '*/.git/*' | sort)
            return 1
          }

          dir=""
          if dir=$(find_project .); then
            echo "Found a Gradle project in the repository: $dir"
          else
            echo "No ready Gradle project in the repository. Looking for a ZIP to extract..."
            out="$GITHUB_WORKSPACE/_zarvimo_extracted"
            rm -rf "$out"
            mkdir -p "$out"
            i=0
            while IFS= read -r z; do
              i=$((i + 1))
              echo "Extracting: $z"
              mkdir -p "$out/$i"
              unzip -q -o "$z" -d "$out/$i" || { echo "Could not unzip $z"; continue; }
              if dir=$(find_project "$out/$i"); then
                echo "Found a Gradle project inside the ZIP: $dir"
                break
              fi
              dir=""
            done < <(find . -maxdepth 3 -iname '*.zip' -not -path '*/.git/*' | sort)
          fi

          if [ -z "$dir" ]; then
            echo "::error::No Gradle project found. Keep the project ZIP in the repository root, or upload the project WITH its folders (app/, settings.gradle.kts, build.gradle.kts, gradle/ ...)."
            echo "Repository files (first 120):"
            find . -maxdepth 3 -not -path './.git/*' | sort | head -n 120
            exit 1
          fi

          rel=$(realpath --relative-to="$GITHUB_WORKSPACE" "$dir")
          echo "dir=$rel" >> "$GITHUB_OUTPUT"
          echo "Gradle project directory: $rel"
          ls -la "$rel"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # The ubuntu runner already ships the Android SDK (ANDROID_HOME). Accepting the licences lets AGP download
      # any missing platform / build-tools itself.
      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # Installs the pinned Gradle version below, so the build does not depend on a committed gradle-wrapper.jar.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # Any failing step stops the job (GitHub runs `bash -e`), so a failed Gradle run can never report success.
      - name: Run unit tests
        working-directory: ${{ steps.locate.outputs.dir }}
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Assemble debug APK
        working-directory: ${{ steps.locate.outputs.dir }}
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify the APK exists
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          ls -l app/build/outputs/apk/debug/
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload unit test reports
        if: always() && steps.locate.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: ${{ steps.locate.outputs.dir }}/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Zarvimo-Live-Cricket-Studio-debug-apk
          path: ${{ steps.locate.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
