name: Build Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

# Least privilege: the build only needs to read the repository.
permissions:
  contents: read

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # The ubuntu-24.04 runner already ships the Android SDK (ANDROID_HOME). We deliberately do NOT use
      # android-actions/setup-android: its default package list ("tools") no longer exists and made the job fail
      # before Gradle ran. Accepting the licences lets AGP download any missing platform / build-tools itself.
      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # Installs the pinned Gradle version below, so the build does not depend on a committed gradle-wrapper.jar.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # Any failing step stops the job (GitHub runs `bash -e`), so a failed Gradle run can never report success.
      - name: Run unit tests
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Assemble debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify the APK exists
        run: |
          ls -l app/build/outputs/apk/debug/
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

      - name: Upload debug APK
        if: success() && hashFiles('app/build/outputs/apk/debug/app-debug.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: Zarvimo-Live-Cricket-Studio-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
